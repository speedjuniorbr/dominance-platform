<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOMINANCE Workspace — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma tela; barra lateral clara de conversas + coluna central de leitura (~760px) com compositor fixo no rodapé. */
:root{
  --night:#0B1324; --cobalt:#2342C8; --gold:#C9962F; --gold-ink:#8A6417; --steel:#8A94A6; --mist:#F3F5F9;
  --bg:#FFFFFF; --side:#F3F5F9; --ink:#0B1324; --muted:#556074; --line:#DCE1EA; --soft:#EEF1F6;
  --accent:#2342C8; --accent-soft:#E8ECFD; --gold-soft:#F7EEDB; --warn:#A86200; --warn-soft:#FBEFD9; --crit:#B3262D; --crit-soft:#FBE5E6; --ok:#1D7A4C; --ok-soft:#E2F3EA;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --side:#0A111F; --ink:#E6EAF2; --muted:#98A3B7; --line:#233049; --soft:#152036;
  --accent:#8FA3FF; --accent-soft:#1B2550; --gold-ink:#E2B45E; --gold-soft:#2D2513; --warn:#F0A63E; --warn-soft:#2C2010; --crit:#F27880; --crit-soft:#2E1517; --ok:#52C48E; --ok-soft:#12291F; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1626; --side:#0A111F; --ink:#E6EAF2; --muted:#98A3B7; --line:#233049; --soft:#152036;
  --accent:#8FA3FF; --accent-soft:#1B2550; --gold-ink:#E2B45E; --gold-soft:#2D2513; --warn:#F0A63E; --warn-soft:#2C2010; --crit:#F27880; --crit-soft:#2E1517; --ok:#52C48E; --ok-soft:#12291F; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
.app{display:grid;grid-template-columns:272px 1fr;height:100%}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 6px;text-decoration:none;color:inherit}
.brand b{font-family:var(--display);font-stretch:125%;font-weight:800;letter-spacing:.1em;font-size:14px}
.brand span{font-family:var(--display);font-weight:500;font-size:14px;color:var(--muted)}
.newchat{margin:12px 14px 6px;display:flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:500}
.newchat:hover{border-color:var(--accent)}
.nav{display:flex;flex-direction:column;padding:6px 10px;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:inherit;text-decoration:none;font-size:14px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--soft);font-weight:500}
.grp{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:14px 20px 4px}
.convs{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:1px}
.convs button{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:inherit;width:100%}
.convs button:hover,.convs button.on{background:var(--soft)}
.convs button span.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dotlocal{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.dotcloud{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.me{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.me .who{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.me select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:13px}
.me label{font-size:12px;color:var(--muted)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.banner{background:var(--gold-soft);color:var(--gold-ink);font-size:12.5px;padding:6px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner a{color:inherit}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{font-size:16px;font-weight:600;font-family:var(--body)}
.shield{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--muted);background:var(--bg);cursor:pointer}
.shield:hover{border-color:var(--accent);color:var(--ink)}
.view{flex:1;overflow-y:auto;min-height:0}
.col{max-width:780px;margin:0 auto;padding:28px 24px 24px;display:flex;flex-direction:column;gap:22px}
.empty{padding-top:6vh;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.empty h2{font-size:30px;font-weight:700;font-stretch:110%}
.empty p{color:var(--muted);max-width:52ch}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin-top:10px}
.starters button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;display:flex;flex-direction:column;gap:4px}
.starters button:hover{border-color:var(--accent)}
.starters small{color:var(--muted);font-size:12.5px}
.msg{display:flex;flex-direction:column;gap:6px}
.msg.user{align-items:flex-end}
.bubble{background:var(--soft);border-radius:14px;padding:10px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.answer{display:flex;gap:12px;align-items:flex-start}
.answer .mk{flex:none;margin-top:3px}
.answer .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.answer .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.answer .txt code{font-family:var(--mono);font-size:13px;background:var(--soft);padding:1px 5px;border-radius:4px}
.answer pre{background:var(--night);color:#DCE3F0;font-family:var(--mono);font-size:13px;padding:12px 14px;border-radius:10px;overflow-x:auto;margin:0;white-space:pre}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.local{background:var(--gold-soft);color:var(--gold-ink)}
.pill.cloud{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--soft);color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;padding:2px 4px;text-decoration:underline}
.path{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:13px}
.path div{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center}
.path .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.blocked{border:1px solid var(--crit);background:var(--crit-soft);color:var(--crit);border-radius:12px;padding:10px 14px;font-size:14px}
.caret::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--muted)}
@keyframes blink{50%{opacity:0}}
/* composer */
.composer-wrap{border-top:1px solid var(--line);background:var(--bg)}
.composer{max-width:780px;margin:0 auto;padding:12px 24px 16px;display:flex;flex-direction:column;gap:8px}
.box{border:1px solid var(--line);border-radius:16px;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(11,19,36,.04)}
.box:focus-within{border-color:var(--accent)}
.box textarea{border:0;background:transparent;resize:none;padding:14px 16px 6px;min-height:56px;max-height:200px;outline:none}
.box .row{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;flex-wrap:wrap}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;position:relative}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.modelsel{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;font-size:13.5px;max-width:260px}
.send{margin-left:auto;background:var(--night);color:#fff;border:0;border-radius:10px;height:34px;padding:0 14px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px}
:root[data-theme="dark"] .send{background:var(--accent);color:#0A101D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .send{background:var(--accent);color:#0A101D}}
.send:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px;background:var(--soft)}
.chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 2px}
.hint{font-size:12.5px;display:flex;gap:8px;align-items:center;min-height:20px;color:var(--muted)}
.hint.warn{color:var(--warn)} .hint.local{color:var(--gold-ink)} .hint.crit{color:var(--crit)}
.err{color:var(--crit);font-size:12.5px}
/* assistants & usage */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.card p{color:var(--muted);font-size:14px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--night);color:#fff;border-color:var(--night)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.track{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.track span{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.pol{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.pol:last-child{border-bottom:0}
.pol p{color:var(--muted);font-size:13.5px}
.overlay{position:fixed;inset:0;background:rgba(6,11,22,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:15;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(6,11,22,.4)}
  .menu-btn{display:grid}
  .starters,.grid,.kpis{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Conversas e navegação">

    <nav class="nav" aria-label="Seções">
      <a href="#conversa" data-v="conversa">

    <div class="grp">Recentes</div>
    <div class="convs" id="convs"></div>
    <div class="me">

      <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)"><svg width="14" height="14" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="tp"><path d="M12 12 H50 A38 38 0 0 1 50 88 H12 Z"/></clipPath></defs><g clip-path="url(#tp)"><rect x="12" y="12" width="80" height="20" fill="#E07B39"/><rect x="12" y="40" width="80" height="20" fill="#3D5BE0"/><rect x="12" y="68" width="80" height="20" fill="#2E9E6B"/></g></svg> Parte da DOMINANCE® Platform</div>
      <label for="as">Ver o protótipo como</label>
      <select id="as">
        <option value="ana">Ana Ribeiro · Jurídico</option>
        <option value="carla">Carla Souza · Comercial</option>
        <option value="diego">Diego Alves · Atendimento</option>
      </select>
    </div>
  </aside>

  <div class="main">
    <div class="banner"><span>Protótipo navegável do DOMINANCE Workspace. Respostas simuladas; nada é enviado a modelos reais.</span><a href="../governance/index.html">Abrir o console de governança</a></div>
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button class="iconbtn menu-btn" id="menu" type="button" aria-label="Abrir menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 id="title">Nova conversa</h1>
      </div>
      <button class="shield" id="shield" type="button">
        <svg width="14" height="14" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="sc"><path d="M12 12 H50 A38 38 0 0 1 50 88 H12 Z"/></clipPath></defs><g clip-path="url(#sc)"><rect x="12" y="12" width="80" height="20" fill="currentColor"/><rect x="12" y="40" width="80" height="20" fill="#C9962F"/><rect x="12" y="68" width="80" height="20" fill="currentColor"/></g></svg>
        <span id="shield-txt">Protegido pelo DOMINANCE</span>

    </header>
    <main class="view" id="view" tabindex="-1"></main>
    <div class="composer-wrap" id="composer-wrap">
      <form class="composer" id="composer" novalidate>
        <div class="box">
          <div class="chips" id="chips"></div>
          <label for="input" class="sr" style="position:absolute;left:-9999px">Mensagem</label>
          <textarea id="input" rows="2" placeholder="Pergunte, peça um rascunho ou anexe um documento"></textarea>
          <div class="row">
            <span class="iconbtn" title="Anexar arquivo"><input type="file" id="file" aria-label="Anexar arquivo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 01-7-7L14 4.5a3.5 3.5 0 015 5L10.5 18a2 2 0 01-3-3L15 7.5"/></svg></span>
            <label for="model" style="position:absolute;left:-9999px">Modelo</label>
            <select id="model" class="modelsel"></select>
            <button class="send" id="send" type="submit" disabled>Enviar <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </div>
        </div>
        <div class="hint" id="hint" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal" id="modal"></div></div>

}

  <div class="kpi"><small>Orçamento da equipe ${u.equipe}</small><b>${Math.round(pct)}%</b><div class="track" style="margin-top:6px"><span style="width:${Math.min(100, pct)}%;background:${pct >= 100 ? 'var(--crit)' : pct >= 80 ? 'var(--warn)' : 'var(--accent)'}"></span></div></div></div>
  <div class="card"><h3 style="font-size:16px">Regras que se aplicam a você</h3>${pols.map(p => `<div class="pol">${mark(18)}<div><b style="font-weight:500">${p[0]}</b><p>${p[1]}</p></div></div>`).join('')}</div>
  <div class="card"><h3 style="font-size:16px">Pedidos desta sessão</h3>${S.reqLog.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Hora</th><th>Modelo</th><th>Regra aplicada</th><th class="r">Tokens</th><th class="r">Custo</th></tr></thead><tbody>${S.reqLog.map(r => `<tr><td>${r.quando}</td><td>${MODELS[r.alias].nome} <span class="pill ${MODELS[r.alias].local ? 'local' : 'cloud'}">${MODELS[r.alias].local ? 'local' : 'nuvem'}</span></td><td>${esc(r.aviso)}</td><td class="r">${nf.format(r.tokens)}</td><td class="r">${usd(r.custo)}</td></tr>`).join('')}</tbody></table></div>` : '<p>Envie uma mensagem em Conversas e ela aparece aqui.</p>'}</div></div>`;
}

function show() {
  const v = location.hash.replace('#', '') || 'conversa';
  S.view = ['conversa', 'agentes', 'meu-uso'].includes(v) ? v : 'conversa';
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.v === S.view));
  $('composer-wrap').style.display = S.view === 'conversa' ? '' : 'none';
  ({ conversa: renderChat, agentes: renderAssistants, 'meu-uso': renderUsage })[S.view]();
  $('side').classList.remove('open');
}
function setUser(k) {
  S.user = k; S.conv = null; $('input').value = ''; S.assistente = null; S.anexo = null; S.alias = 'auto';
  const u = U(); $('av').textContent = u.ini; $('me-name').textContent = u.nome; $('me-team').textContent = u.equipe;
  $('shield-txt').textContent = u.sensivelLocal ? 'Protegido · conteúdo sensível local' : 'Protegido pelo DOMINANCE';
  renderModelSel(); renderConvs(); renderChips(); show(); updateHint();
}

/* ===== Eventos ===== */
$('composer').addEventListener('submit', e => { e.preventDefault(); const t = $('input').value.trim(); if (t.length < 2) return; $('input').value = ''; send(t); });
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); } });
$('input').addEventListener('input', () => { const el = $('input'); el.style.height = 'auto'; el.style.height = Math.min(200, el.scrollHeight) + 'px'; updateHint(); });
$('model').addEventListener('change', e => { S.alias = e.target.value; updateHint(); });
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) { S.anexo = f.name; renderChips(); updateHint(); if (!$('input').value) $('input').placeholder = 'Diga o que fazer com o arquivo anexado'; } e.target.value = ''; });
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; if (b.dataset.rm === 'file') S.anexo = null; else { S.assistente = null; S.alias = 'auto'; renderModelSel(); } renderChips(); updateHint(); if (S.view === 'conversa' && !curConv()) renderChat(); });
$('convs').addEventListener('click', e => { const b = e.target.closest('[data-conv]'); if (!b) return; S.conv = b.dataset.conv; renderConvs(); if (location.hash !== '#conversa') location.hash = 'conversa'; else show(); });
$('newchat').addEventListener('click', () => { S.conv = null; S.assistente = null; S.alias = 'auto'; renderModelSel(); renderChips(); renderConvs(); if (location.hash !== '#conversa') location.hash = 'conversa'; else show(); $('input').focus(); });
$('view').addEventListener('click', e => {
  const st = e.target.closest('[data-start]'); if (st) { send(STARTER_TEXT[S.user][+st.dataset.start]); return; }
  const p = e.target.closest('[data-path]'); if (p) { const m = curConv().msgs[+p.dataset.path]; m.open = !m.open; renderChat(); return; }
  const u = e.target.closest('[data-use]'); if (u) { S.assistente = ASSISTANTS.find(a => a.id === u.dataset.use); S.conv = null; S.alias = S.assistente.alias; renderModelSel(); renderChips(); renderConvs(); location.hash = 'conversa'; setTimeout(() => $('input').focus(), 50); }
});
$('as').addEventListener('change', e => setUser(e.target.value));
$('menu').addEventListener('click', () => $('side').classList.toggle('open'));
$('shield').addEventListener('click', () => {
  const u = U();
  $('modal').innerHTML = `<h2 id="mt" style="font-size:20px">Como o DOMINANCE protege esta conversa</h2>
  <p style="color:var(--muted)">Todo pedido passa por sete verificações antes de chegar a um modelo: identidade, permissão, orçamento, política de dados, cache, rota e auditoria.</p>
  <div class="path"><div><span class="n">1</span><span>Você entrou com o login da empresa</span><span></span></div><div><span class="n">2</span><span>Modelos liberados para ${u.equipe}: ${u.modelos.map(a => MODELS[a].nome).join(', ')}</span><span></span></div><div><span class="n">3</span><span>Orçamento da equipe: ${Math.round(u.orc.usado / u.orc.limite * 100)}% usado</span><span></span></div><div><span class="n">4</span><span>${u.sensivelLocal ? 'Conteúdo sensível fica na base local' : 'Dados pessoais mascarados antes da nuvem'}</span><span></span></div></div>
  <div style="display:flex;justify-content:flex-end"><button class="btn primary" type="button" id="mclose">Entendi</button></div>`;
  $('overlay').classList.add('on'); $('mclose').focus(); $('mclose').onclick = () => { $('overlay').classList.remove('on'); $('shield').focus(); };
});
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('overlay').classList.remove('on'); });
window.addEventListener('hashchange', show);

S.conv = 's1';
setUser('ana'); S.conv = 's1'; renderConvs(); show();
</script>
</body>
</html>
